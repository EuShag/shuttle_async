name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main  # Если ветка master, замени main на master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Устанавливаем Doxygen и Graphviz
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Собираем оба языка
      - name: Run Doxygen (EN & RU)
        run: |
          doxygen Doxyfile
          doxygen Doxyfile.ru

      # Создаем красивую главную страницу для выбора языка
      - name: Create Index Page
        run: |
          mkdir -p docs/api
          touch docs/api/.nojekyll
          cat << 'EOF' > docs/api/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>shuttle_async Documentation</title>
              <style>
                  body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #1e1e1e; color: #fff; }
                  a { color: #58a6ff; text-decoration: none; font-size: 24px; margin: 20px; display: inline-block; padding: 10px 20px; border: 1px solid #58a6ff; border-radius: 5px; }
                  a:hover { background: #58a6ff; color: #1e1e1e; }
              </style>
          </head>
          <body>
              <h1>shuttle_async API Documentation</h1>
              <p>Choose your language / Выберите язык:</p>
              <a href="en/html/index.html">English</a>
              <a href="ru/html/index.html">Русский</a>
          </body>
          </html>
          EOF

      # Настраиваем артефакты для GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Загружаем собранную папку docs/api
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/api'

      # Публикуем сайт в сеть
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
