name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main  # Если твоя ветка называется master, замени main на master

# Разрешаем скрипту публиковать данные на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Устанавливаем Doxygen и Graphviz (для красивых диаграмм связей классов)
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Собираем русскую документацию (она создаст свой index.html в docs/api)
      - name: Run Doxygen (RU)
        run: doxygen Doxyfile.ru

      # Отключаем Jekyll, чтобы GitHub Pages не ломал стили, фреймы и пути Doxygen
      - name: Disable Jekyll
        run: touch docs/api/.nojekyll

      # Настраиваем артефакты для GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Загружаем содержимое docs/api, где Doxygen развернул интерфейс
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/api'

      # Публикуем сайт в сеть
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
