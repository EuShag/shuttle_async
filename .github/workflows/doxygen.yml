name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main  # If your mainline branch is named 'master', change 'main' to 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Automatically fetches vendored dependencies (mimalloc, concurrentqueue)

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz plantuml

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DASYNC_BUILD_TESTS=OFF \
            -DASYNC_BUILD_EXAMPLES=OFF

      - name: Run Doxygen Generation
        run: doxygen Doxyfile

      - name: Disable Jekyll Integration
        run: touch docs/api/html/.nojekyll

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/api/html'  # Directly uploads the folder where Doxygen created index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
