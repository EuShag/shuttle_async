name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main  # Или master, смотря как называется твоя главная ветка

# Разрешаем скрипту публиковать данные на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Устанавливаем Doxygen и Graphviz (для красивых диаграмм связей классов)
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Собираем английскую документацию
      - name: Run Doxygen (EN)
        run: doxygen Doxyfile

      # Собираем русскую документацию
      - name: Run Doxygen (RU)
        run: doxygen Doxyfile.ru

      # Настраиваем главную страницу на автоматический мгновенный переход к красивой документации
      - name: Create Index Page
        run: |
          mkdir -p docs/api
          touch docs/api/.nojekyll
          cat << 'EOF' > docs/api/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=html/index.html" />
          </head>
          <body>
              <p>Redirecting to documentation...</p>
          </body>
          </html>
          EOF
      
      

      # Настраиваем артефакты для GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Загружаем сгенерированную папку docs/api на сервера GitHub
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/api'

      # Публикуем сайт в сеть
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
